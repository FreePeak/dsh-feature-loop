# Activation patch for the containerised profile.
#
# Seeds into $DSH_HOME/profiles/<profile>/cordis.patch.yml on first run.
#
# The npm bundles install the feature-loop plugin with NO spec, so it loads and
# does nothing. This layer targets the same row id and turns the policies on.
#
# Two things matter and are easy to get wrong:
#
# 1. TOOL NAMES. The harness's tools are `read`, `write`, `edit`, `bash`,
#    `glob`, `grep`. The names `read_file` / `write_file` / `edit_file` /
#    `run_tests` belong to this repo's *standalone runner* (src/tools.ts) and
#    match nothing in a harness session. A name that matches nothing is not an
#    error — the tool falls through to the unclassified `irreversible` default,
#    so the gate still fires but with `always-approve` instead of the policy you
#    configured. That is the "working for the wrong reason" trap.
#
# 2. NO JUDGE. With no judge the confidence estimate is undefined, so
#    `auto-if-confident` has no evidence of confidence and the gate ASKS the
#    human. That fail-closed ask is what produces the approval panel.

# The route the loop actually uses. WITHOUT this row the loop runs on the
# harness's own default — `provider: deepseek-official` — and every model call
# in the container dies with:
#
#   llm-deepseek: no API key for provider route "deepseek-official"
#
# while the UI, the dashboard and the approval panel all look perfect. Verified
# 2026-10-01 against harness 0.2.0-rc.2: the row was missing, the container
# booted clean, and the first `dsh headless` run failed on a key nobody supplied
# because nobody had asked for that provider.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: onegw
    model: opencode/deepseek-v4.1-flash

- id: feature-loop
  config:
    reviewBudget: 0.10
    judgeThreshold: 2
    # `ask` prompts in the Web UI composer. It fails closed to a refusal when no
    # approval channel is mounted, so it is never less safe than `deny`.
    # Set `deny` for unattended/CI runs where nobody is watching.
    gateMode: ask
    gatePolicies:
      read: auto
      glob: auto
      grep: auto
      edit: auto-if-confident
      # `always-approve`, matching the shipped `cordis.patch.yml`. With
      # `auto-if-confident` and a judge that is confident, writes clear
      # silently and a human watching sees no approval — see the note there.
      write: always-approve
    # The HITL approval dashboard. Inside the container it binds 0.0.0.0 so the
    # published port can reach it — compose publishes 127.0.0.1:${DSH_DASHBOARD_PORT}
    # on the host, so the posture stays loopback-only end to end. The token is
    # generated at start; `make dashboard` rebuilds the URL from the log line.
    #
    # `standalone: true` is REQUIRED and its absence is silent. Without it the
    # dashboard is a page INSIDE the DSH UI, reached over the host remote — so no
    # server binds, nothing listens on 8100, no `feature-loop dashboard:` line is
    # printed, and the published port in compose connects to nothing. Verified
    # 2026-10-01: exactly this profile, `enabled: true` and no `standalone`, gave
    # a clean boot with no dashboard and no error of any kind.
    dashboard:
      enabled: true
      standalone: true
      host: 0.0.0.0
      port: 8100
      answers: true
    spec:
      goal: "the failing test passes and no other test breaks"
      sensor: ["repo files", "test output"]
      controller:
        # Two roles, not one rung: `execution` does the work (cheap-first),
        # `planning` takes over when the cheap tier stalls. These are onegw
        # role aliases (verified live against /v1/models), not provider/model
        # pairs — the gateway resolves them. `stepsPerRung: 5` means the
        # executor gets 5 steps before the ladder even considers climbing.
        ladder:
          - { provider: onegw, model: execution }
          - { provider: onegw, model: planning }
        stepsPerRung: 5
        escalateAfterFailures: 2
      actuator:
        read: read
        glob: read
        grep: read
        bash: irreversible
        edit: reversible-write
        write: irreversible
      feedback: "all tests pass, and the diff is the smallest that achieves it"
      termination:
        successCommand: "true"
        guards: ["error-cascade", "tool-cycle"]
      maxSteps: 12
      costBudgetUSD: 1.00
      # Prices keyed by the ladder's route keys (`provider/model`). Role
      # aliases price identically — execution and planning are routing names
      # for the same gateway account, so the marginal rates match until
      # onegw publishes per-role pricing.
      prices:
        onegw/execution:
          inputPerMTok: 0.14
          outputPerMTok: 0.28
          cacheReadPerMTok: 0.014
        onegw/planning:
          inputPerMTok: 0.14
          outputPerMTok: 0.28
          cacheReadPerMTok: 0.014
    # Run history + Metrics, on by default. Every closed turn appends one
    # JSONL line; the dashboard's Metrics panel rolls the file up. Records
    # are evidence, never control — a failed append is a feed line, not a
    # failed turn. Loopback-only end to end (the file lives in the volume).
    optimize:
      history: .feature-loop/runs.jsonl
