# CI for @freepeak/dsh-feature-loop.
#
# Two jobs, both on Node 22 — `node --experimental-strip-types` is a Node 22
# feature, so neither the suite nor the sources can run on anything older.
#
#   test      — the dependency-free subset of the suite, listed explicitly.
#   typecheck — `tsc --noEmit` over the harness-free subset of `src/`.
#
# One verified fact about this repository shapes the typecheck job.
#
# 1. An install used to be impossible: the manifest pinned harness-monorepo
#    workspace versions (`@deepseek-ai/cordis@0.4.0`,
#    `@deepseek-ai/schemastery@0.1.5`) that were never published, so a bare
#    install died with ERR_PNPM_NO_MATCHING_VERSION. Fixed — the harness packages
#    are now optional peers, and the typecheck job installs normally.
#
# `test` needs none of that: it runs on a checkout with no node_modules at all,
# which is deliberate and worth keeping. The job lists the test files whose
# import closure is dependency-free, exactly as the typecheck job lists the
# `src/` modules it covers. `test/plugin-approval.test.ts` is the one file left
# out: it imports `src/plugin.ts`, and the plugin's `@deepseek-ai/dsh-*` imports
# are unpublished peers that no install can fetch — so, like `src/plugin.ts`,
# that test is covered locally against the prebuilt packages, and the real
# handshake is covered by the integration suite.
#
# `typecheck` deliberately does not run `tsc -p tsconfig.json`. `tsconfig.json`
# includes all of `src`, and `src/plugin.ts` imports `@deepseek-ai/dsh-*` and
# `@deepseek-ai/cordis` at versions CI cannot resolve, so a project-wide run dies
# with TS2307 on those imports (and TS2318 on the global `Disposable` type)
# before any real type checking happens — verified. The job instead typechecks
# the files whose import closure is harness-free, using the same compiler options
# as `tsconfig.json`. `src/plugin.ts` — the only harness-coupled module left
# since the fork was removed — is therefore NOT typechecked here; it is covered
# locally, against the prebuilt harness packages in the maintainer's
# node_modules. See the README's "Known limits".
#
# ---------------------------------------------------------------------------
# RUNNER: GitHub-hosted `ubuntu-latest`.
#
# These jobs used a self-hosted runner while the repository was private —
# GitHub Free's included Actions minutes apply only to private repos and run
# out. Publishing changes the calculus both ways: public repositories get
# unlimited hosted minutes, and a pull-request job on a self-hosted runner
# executes a stranger's code on the maintainer's machine, with that machine's
# files and credentials in reach. Never reintroduce `runs-on: self-hosted`
# here — `.githooks/pre-commit` blocks it (see AGENTS.md).
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Node 22)
    # GitHub-hosted — see the RUNNER note at the top of this file.
    runs-on: ubuntu-latest
    # A hung job would occupy a runner indefinitely, so cap both jobs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately no install step: a checkout with no node_modules is what
      # proves these files are dependency-free. They are listed explicitly, the
      # same way the typecheck job lists its `src/` inputs — and a test that
      # gains a harness import (`test/plugin-approval.test.ts` already has one,
      # through `src/plugin.ts`) or a dependency import must leave this list,
      # exactly as `src/plugin.ts` leaves the typecheck list. `test/dashboard.test.ts`,
      # `test/assistant-ui.test.ts` and `test/explainer.test.ts` run locally via
      # `make test`; `test/approval-bridge.test.ts`, `test/brief.test.ts`, and
      # `test/questioner.test.ts` are pure and run here.
      # exactly as `src/plugin.ts` leaves the typecheck list. `test/dashboard.test.ts`
      # and the CSS pair run locally via `make test` — they import
      # `src/plugin.ts`, which the harness-free job cannot load.
      # `test/assistant-ui.test.ts` IS in this list: the bundle it asserts against
      # is CHECKED IN, not built here, so it runs with no install — verified on a
      # bare clone before it was moved here (2026-10-01); its exclusion note
      # claimed the opposite. Everything pure runs
      # here, including `test/approvals.test.ts` (the registry behind the gate),
      # added 2026-10-01 because `scripts/check-test-list.mjs` noticed it was in
      # neither this list nor any other: the most consequential test in the repo
      # was running nowhere in CI.
      # `test/judge-config.test.ts` is out for the same reason as
      # `test/plugin-approval.test.ts`: it imports `src/plugin.ts` to reach
      # `resolveJudge`, which carries a runtime `@deepseek-ai/dsh-llm` import.
      # `test/judge.test.ts` stays IN this list — the judge client itself is pure,
      # so the config resolution lives in its own file rather than dragging a
      # harness import into a file that currently runs here.
      # The same drift the typecheck job checks for: a new PURE test file is not
      # in this list, so it never runs in CI and nothing says so. The step after
      # this one fails on that.
      - name: The no-install test list is not stale
        run: node scripts/check-test-list.mjs

      # The shipped specs' ladders must name models their deployment declares.
      # A rung that does not is not a config smell, it is a run that dies
      # UNKNOWN_MODEL on step 1 — after the dashboard has already recorded the
      # route, the step and the spend, which reads as a working loop. The
      # container shipped exactly that and it cost a day to find.
      - name: Every ladder rung is a declared model, and is priced
        run: node scripts/check-ladder-models.mjs

      # Three rounds running. `escalateAfterFailures` is set in every shipped
      # profile, documented as driven by the step outcome, and had no caller
      # outside its own unit test — so the ladder could only climb on step
      # count. `grep` finds the definition; it does not find the ABSENCE of a
      # caller, which is the thing worth catching.
      - name: No exported symbol in src/ is dead
        run: node scripts/check-dead-exports.mjs

      - name: Run the test suite
        run: node --experimental-strip-types --test \
          test/agent-policy.test.ts test/approval-bridge.test.ts test/approvals.test.ts test/brief.test.ts \
          test/budget.test.ts test/driver.test.ts test/envelope.test.ts test/evidence.test.ts \
          test/explainer.test.ts test/judge.test.ts test/metrics.test.ts test/optimize.test.ts \
          test/optimizer.test.ts test/patch-config.test.ts test/phase-budget.test.ts test/phases.test.ts \
          test/pipeline-guard.test.ts test/pipeline.test.ts test/policy.test.ts test/questioner.test.ts \
          test/refine.test.ts test/runlog.test.ts test/runner.test.ts test/sandbox.test.ts \
          test/ship.test.ts test/start-target.test.ts test/tools.test.ts test/yolo.test.ts

          test/agent-policy.test.ts test/approval-bridge.test.ts \
          test/approvals.test.ts test/assistant-ui.test.ts test/brief.test.ts \
          test/budget.test.ts test/envelope.test.ts test/explainer.test.ts \
          test/judge.test.ts \
          test/metrics.test.ts test/optimize.test.ts test/optimizer.test.ts \
          test/questioner.test.ts \
          test/policy.test.ts test/refine.test.ts test/runlog.test.ts \
          test/runner.test.ts test/start-target.test.ts test/tools.test.ts

  typecheck:
    name: typecheck (harness-free src/ modules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A normal install now works. It used to be impossible: the manifest
      # pinned `@deepseek-ai/cordis@0.4.0` and `@deepseek-ai/schemastery@0.1.5`,
      # which are harness-MONOREPO workspace versions that were never published,
      # so `npm install` aborted with ERR_PNPM_NO_MATCHING_VERSION. Those are no
      # longer devDependencies, the harness packages are optional peers supplied
      # by the deployment, and `.npmrc` disables peer auto-installation (some
      # transitive peers, like `@deepseek-ai/dsh-type-meta`, are unpublished).
      # So the install is three packages: typescript, @types/node, tsdown.
      # No telemetry opt-out is needed any more: the OpenUI dependency that
      # shipped an install-time ping is gone. `@assistant-ui/react` pulls
      # `assistant-cloud` but the bundle build asserts it tree-shakes out.
      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      # Files are listed explicitly rather than using tsconfig.json, and every
      # option below mirrors it: target ES2024, NodeNext module and resolution,
      # strict, esModuleInterop, skipLibCheck, isolatedModules,
      # allowImportingTsExtensions, jsx react-jsx, noEmit.
      # `rootDir`/`outDir`/`declaration`/`composite` are moot under --noEmit
      # and are left out.
      #
      # The list is the import closure with no `@deepseek-ai/*` in it.
      # src/plugin.ts and src/index.ts import the harness, and those packages are
      # peers this job deliberately does not install — they are supplied by the
      # deployment, and their published types differ from a local checkout's. So
      # the two harness-coupled modules are typechecked locally instead, against
      # the prebuilt packages from a harness checkout. Add a new pure module to
      # this list; a module that gains a harness import must leave it.
      # src/brief.ts, src/approval-bridge.ts and src/explainer.ts are the pure
      # additions: `brief.ts` and `approval-bridge.ts` import nothing at all
      # (which is why their tests run in the no-install job above), and
      # `explainer.ts` imports only this repo's own modules plus the LLM
      # transport type. `src/questioner.ts` is pure (LLM reason → Laya decide →
      # LLM act) and is listed with the other harness-free modules.
      - name: tsc --noEmit
        run: |
          npx tsc --noEmit \
            --target ES2024 --module NodeNext --moduleResolution NodeNext \
            --strict --esModuleInterop --skipLibCheck --isolatedModules \
            --allowImportingTsExtensions \
            src/agent-policy.ts src/approval-bridge.ts src/approvals.ts src/brief.ts src/budget.ts \
            src/dashboard-page.ts src/dashboard.ts src/driver.ts src/envelope.ts src/evidence.ts \
            src/explainer.ts src/judge.ts src/laya.ts src/llm.ts src/messages.ts \
            src/metrics.ts src/observation.ts src/optimize.ts src/optimizer.ts src/phase-budget.ts \
            src/phase-notice.ts src/phases.ts src/pipeline.ts src/prompts.ts src/questioner.ts \
            src/refine.ts src/review.ts src/routing.ts src/runlog.ts src/runner.ts \
            src/sandbox.ts src/ship.ts src/signals.ts src/spec.ts src/tools.ts \
            src/watcher-ttl.ts src/yolo.ts
