# The feature-loop plugin's patch layer.
#
# Applied after the profile's own bundles, this inserts TWO rows: the plugin
# itself, and the `/loop` host command. It does not disable or replace the
# harness's agent loop — that is the
# whole point of the de-fork. The loop keeps running upstream's implementation,
# and these policies hang off its published extension points:
#
#   agent/pre-step     step and cost ceilings, the detectors, the judge, the gate
#   agent/request      the cheap-first ladder
#   tools/pre-execute  the reversibility gate, denying BEFORE dispatch
#
# With `spec` omitted the row loads and does nothing, which makes it safe to add
# to a profile before you have decided on a budget. Supplying `spec` turns the
# policies on; `validateSpec` rejects an incomplete one at load, naming every
# missing dimension rather than failing halfway through a run.
#
# ── WHAT SHIPS ACTIVE ──────────────────────────────────────────────────────
# This row is ON as installed: the spec below turns the ceilings, the detectors,
# the review gate and the HITL dashboard on, and `judge: laya` points at the
# local System One sidecar. That is deliberate — a plugin that installs inert
# teaches you nothing about whether it works, and the previous default (no
# `spec`, no judge) produced no panel, no review and no error to explain the
# silence.
#
# Two things to change for YOUR repo, both in the spec at the bottom:
#   termination.successCommand   the command whose exit 0 means "done"
#   controller.ladder            the provider/model pairs you actually have
#
# Set `spec: null` to switch the policies back off.

- insert:
    - id: feature-loop
      name: '@freepeak/dsh-feature-loop'
      config:
        # The attention router. Both optional; defaults shown.
        reviewBudget: 0.10      # ask the human about <10% of steps
        judgeThreshold: 1       # judge score (0-3) that earns a look.
                                # Laya's live review-worthiness scores sit around
                                # 0.5-1.4, so the old default of 2 meant the
                                # advisor NEVER fired on its own — reviews only
                                # ever came from the detectors. 1 is the setting
                                # at which Laya actually participates.

        # The judge. `laya` is the local System One sidecar: free, sub-second
        # warm, and no key. Point `judgeBaseURL` at a hosted Jev/TypeSafe
        # endpoint and the same wire carries it — nothing else changes.
        # `chat` is metered and needs a gateway key; `none` is detectors only.
        #
        # 8092 is the native macOS Laya service. The old 8091 was the retired
        # containerised sidecar; a judge pointed at it fails closed to
        # detectors-only without saying so.
        judge: laya
        judgeBaseURL: http://127.0.0.1:8092
        systemOneModel: laya
        judgeTimeoutMs: 5000

        # Per-tool gate overrides, by tool name. A tool absent here falls back to
        # its reversibility class from the spec's `actuator`, and an
        # UNCLASSIFIED tool is `irreversible` — the fail-closed direction.
        #
        # THESE ARE THE HARNESS'S REAL TOOL NAMES. Use the names the model
        # actually calls (`read`, `write`, `edit`, `bash`, `glob`, `grep`), not
        # the standalone runner's demo names (`read_file`, `edit_file`, ...) —
        # those exist only in `src/tools.ts` and never appear in a DSH session.
        # A name that matches nothing is not an error: the tool falls through to
        # the unclassified `irreversible` default, so the gate still fires, but
        # with `always-approve` instead of the policy you meant to set.
        gatePolicies:
          read: auto
          glob: auto
          grep: auto
          edit: auto-if-confident
          write: auto-if-confident

        # How a review reaches a human. `ask` (the default) prompts in the Web
        # UI's conversation composer, so you can approve or reject the step.
        # Fails closed to a refusal when no approval channel is mounted, so it is
        # never less safe than `deny`.
        #
        # Set to `deny` for unattended runs and CI, where no human is watching:
        # the call is refused outright and nothing ever prompts.
        gateMode: ask

        # ────────────────────────────────────────────────────────────────────
        # The HITL approval dashboard: a loopback web page that answers this
        # loop's approval requests and shows the run live (step, spend, gate
        # decisions, Metrics). Enabled by default — binds 127.0.0.1 only, and
        # the token is generated per start and printed as
        # `feature-loop dashboard: http://…/?token=…` in the log.
        # Set `enabled: false` to go back to the composer panel as the only
        # channel, exactly as before the dashboard existed.
        #
        # dashboard:
        #   enabled: true
        #   host: 127.0.0.1     # the only accepted values are 127.0.0.1 / 0.0.0.0
        #   port: 8100
        #   answers: true       # false = observe only; composer keeps answering
        #   answerTimeoutMs: 600000   # ask fails closed to `unavailable` after this
        #   brief:              # model-authored review brief per ask (plain prose);
        #     enabled: false    #   off by default — the brief never blocks the ask
        #     model: xiaomi/mimo-v2.5  # required when enabled: the model to ask
        #     maxTokens: 1024   # cap on the brief's own output
        #     timeoutMs: 15000  # per-brief deadline; expiry = no brief, never a hang
        # ────────────────────────────────────────────────────────────────────

        # ────────────────────────────────────────────────────────────────────
        # Optimization: measured history (Laya-guided optimization).
        # On by default: every closed turn appends one JSONL line, and the
        # dashboard's Metrics panel rolls the file up. `loops`/`totalBudgetUSD`
        # are validated at load but consumed only by the CLI's `runRefined` —
        # iteration belongs to the caller, not to a step waterfall.
        #
        # optimize:
        #   history: .feature-loop/runs.jsonl   # run-history file: appended per closed turn, read for Metrics
        #   loops: 3              # refinement passes, integer 3–10 (CLI only; validated at load)
        #   derive: true          # accepted; the CLI's `--derive` derives envelopes, the plugin records the history they come from
        #   judge: chat           # none | chat | laya — who scores across passes (CLI only)
        #   totalBudgetUSD: 3.00  # refinement budget; default is derived × loops × 0.6 (CLI only)
        # ────────────────────────────────────────────────────────────────────

        # ────────────────────────────────────────────────────────────────────
        # The 8-dimension spec. This is what switches the policies ON.
        #
        # All eight dimensions are required and validated at load:
        #   goal · sensor · controller · actuator · feedback · termination
        #   maxSteps · costBudgetUSD  (plus `prices`, without which the cost
        #   ceiling measures against an unknown price and silently reads zero)
        #
        # EDIT `successCommand` AND `ladder` FOR YOUR REPO. The defaults below
        # assume the onegw gateway on this machine; the success command is a
        # placeholder that will simply fail until you point it at your tests.
        # ────────────────────────────────────────────────────────────────────
        spec:
          goal: "the verification command exits 0 and no previously-passing test breaks"
          sensor: ["repository files", "test output"]

          controller:
            # Cheap-first: most steps run on the first rung, and the loop climbs
            # only on evidence (steps spent, consecutive failures) — never on
            # vibes.
            #
            # These ARE your desktop profile's models, so the loop keeps
            # answering on the model you picked in the UI instead of silently
            # swapping in a second one. Two consequences worth knowing:
            #
            #   * The ladder OVERRIDES the selection on every step. `high` below
            #     is the rung's own effort, applied whatever the UI has selected —
            #     which is why it must be declared rather than inherited: an effort
            #     belongs to a model, and a rung that names none now drops the
            #     session's instead of carrying it onto a model that never
            #     offered it (that bug killed every turn with
            #     UNSUPPORTED_REASONING_EFFORT).
            #   * A rung needs its model to offer the effort it asks for. Both
            #     models below declare `high` in the profile's `llm-pi-ai` block;
            #     a hand-written model with no `reasoningEfforts` reports no
            #     reasoning capability at all and refuses every explicit effort.
            #
            # For a gateway cheaper than your own tier (the original onegw role
            # aliases), point the ladder there instead and declare the same
            # `reasoningEfforts` for that provider in the same patch.
            ladder:
              - provider: deepseek-official
                model: opencode/space-bunny-free
                reasoningEffort: high
              - provider: deepseek-official
                model: xai/grok-4.5
            stepsPerRung: 5
            escalateAfterFailures: 2

          actuator:
            # Reversibility classes. `irreversible` is the fail-closed default
            # for anything unclassified, so a tool missing from this map is
            # gated rather than waved through.
            read: read
            glob: read
            grep: read
            bash: irreversible        # arbitrary command execution
            edit: reversible-write
            write: irreversible
            # Anything not named here falls back to `irreversible`. The HITL
            # tool needs a class or it would be gated on every delegated task,
            # which trains people to click Allow without reading.
            task: read

          feedback: "the verification command exits 0, and the diff is the smallest that achieves it"

          termination:
            successCommand: "bash verify.sh"   # ← CHANGE ME to your test command
            guards: ["error-cascade", "tool-cycle"]

          maxSteps: 15
          costBudgetUSD: 1.00

          # Without a price table the cost ceiling cannot price a step and would
          # read $0.00 forever — the failure budget.ts refuses to hide. The keys
          # MUST match the ladder's `provider/model` exactly, or every step falls
          # through to `unpricedFallback` and the ceiling prices a lie.
          #
          # No published rate for the `opencode/` free tier, so the first rung
          # uses the fallback's figures deliberately; replace these with your
          # own plan's rates.
          prices:
            deepseek-official/opencode/space-bunny-free:
              inputPerMTok: 0.00
              outputPerMTok: 0.00
            deepseek-official/xai/grok-4.5:
              inputPerMTok: 0.30
              outputPerMTok: 1.20
          unpricedFallback:
            inputPerMTok: 0.30
            outputPerMTok: 1.20
            cacheReadPerMTok: 0.03

        # ── the 0→1 pipeline ────────────────────────────────────────────────
        # research → PRD → implement → test → ship, each phase with its own
        # budget carved out of `spec.costBudgetUSD` and its own observable exit
        # gate. Requires a `spec` above: a pipeline with no run budget has
        # nothing to carve, and refuses to load rather than running nothing.
        #
        # Shipped DISABLED, so adding the block costs nothing and can be
        # reviewed before it does anything. Flip `enabled: true` to get the
        # five-phase run.
        #
        # Set `testCommand` to YOUR project's test runner. There is no default on
        # purpose: the test phase's exit gate is that command's exit code, and a
        # guessed command would report success for a project whose tests were
        # never run.
        pipeline:
          enabled: false
          # testCommand: npm test
          runsDir: .feature-loop/runs
          # Per-phase ceilings. Absolute USD amounts, not fractions, so they do
          # not drift when `costBudgetUSD` changes. Omit to use the book's
          # default shares (research 10%, prd 10%, implement 35%, test 15%,
          # ship 20%, plus a 10% buffer reserved for the terminal report).
          #
          # phaseMaxSpendUSD:
          #   research: 0.10
          #   implement: 0.35
          phaseMaxSteps:
            research: 8
            prd: 6
            implement: 40
            test: 30
            ship: 10
          # A step ceiling is only reached by SPENDING steps; a loop that is slow
          # rather than busy never spends its way to one. These fire regardless
          # of the loop's internal state.
          phaseTimeoutMs: 900000     # 15min per phase
          timeoutMs: 5400000         # 90min for the whole run

        # YOLO is the other half of the 0→1 story, and is OFF here.
        #
        #   ask   the Web UI prompts you (default — supervised)
        #   deny  refuse outright, for unattended CI
        #   auto  YOLO: never prompts. Reads, writes inside the run's worktree,
        #         pushing its own branch and opening a PR are allowed; pushing a
        #         protected branch, force-push, merge, publish, deploy and
        #         touching a credential are DENIED.
        #
        # `auto` refuses to work without a worktree, because containment with
        # nothing to contain against is not containment. `make install` creates
        # one via src/sandbox.ts before you flip this.
        # gateMode: ask

    # The Feature Loop sidebar page's host service (`ctx.remote.featureLoop.*`).
    # Separate row for the same reason dsh-mux has one: the client bundle mounts
    # its own remote contribution, and a single row cannot both declare the
    # namespace and consume it without deadlocking the loader.
    - id: feature-loop-remote
      name: '@freepeak/dsh-feature-loop/remote'

    # The `/loop` host command: `/loop <task>` names a task for the bounded
    # loop. The handler returns the task text for the composer to submit as
    # the turn, so the loop policies apply to it exactly as to any typed
    # request. Same package, separate row: the host command registry owns
    # `commands`, and the policy row must not inject it.
    - id: feature-loop-command
      name: '@freepeak/dsh-feature-loop/command'
