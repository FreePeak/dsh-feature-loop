# Fork of @deepseek-ai/dsh-agent-loop: book-shaped budget, routing, review.
#
# Replaces the upstream agent-loop row with our own, which carries the
# 8-dimension spec, step/cost ceilings, cheap-first routing, and the
# attention router. When the spec is omitted, the upstream behaviour is
# reproduced exactly — no ceilings, one route — which is what keeps
# this fork comparable against its parent for the parity harness.

# 1. Disable upstream's agent-loop — same id, same type, different behaviour.
- id: agent-loop
  disabled: true

# 2. Insert our own, which owns the same AgentFactory slot.
- insert:
    - id: agent-loop
      name: '@freepeak/dsh-feature-loop'
      config:
        agents: []
        # Example spec — uncomment and adapt for your project:
